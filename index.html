<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADM 3Colinas</title>
<meta name="description" content="Gestão do TOP da equipe ADM · Legendários Base 3 Colinas">
<meta name="theme-color" content="#090d13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADM 3Colinas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral fixa (desktop) / abas inferiores (celular); conteúdo em painéis de campo, laranja como sinal de ação e alerta. Dark-first. */
:root {
  --bg: #090d13; --surface: #111821; --surface2: #18212c; --line: #26313d;
  --fg: #f4ede5; --muted: #a8998a; --accent: #ff7a1a; --accent-soft: rgba(255,122,26,.14); --on-accent: #1a0c00;
  --good: #46c486; --good-soft: rgba(70,196,134,.14); --warn: #f2b233; --warn-soft: rgba(242,178,51,.15);
  --bad: #ff5d52; --bad-soft: rgba(255,93,82,.14); --shadow: 0 10px 30px rgba(0,0,0,.45);
  --wa: #25d366; --on-wa: #062b14;
  --display: "Outfit", system-ui, sans-serif;
  --body: "Outfit", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #ffffff; --surface: #fff8f2; --surface2: #ffeedf; --line: #f1dcc7;
  --fg: #1e140b; --muted: #7b6553; --accent: #e65c00; --accent-soft: rgba(230,92,0,.10); --on-accent: #ffffff;
  --good: #1d8a55; --good-soft: rgba(29,138,85,.10); --warn: #a86f00; --warn-soft: rgba(201,140,0,.13);
  --bad: #cc3329; --bad-soft: rgba(204,51,41,.10); --shadow: 0 10px 30px rgba(120,60,10,.14);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #fff8f2; --surface2: #ffeedf; --line: #f1dcc7;
  --fg: #1e140b; --muted: #7b6553; --accent: #e65c00; --accent-soft: rgba(230,92,0,.10); --on-accent: #ffffff;
  --good: #1d8a55; --good-soft: rgba(29,138,85,.10); --warn: #a86f00; --warn-soft: rgba(201,140,0,.13);
  --bad: #cc3329; --bad-soft: rgba(204,51,41,.10); --shadow: 0 10px 30px rgba(120,60,10,.14);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { min-height: 100%; }
.side { position: fixed; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); z-index: 45; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 4px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  transform: translateX(-105%); visibility: hidden; }
.app.menu-open .side { transform: none; visibility: visible; box-shadow: var(--shadow); }
.scrim { position: fixed; inset: 0; z-index: 44; background: rgba(0,0,0,.5); }
.side-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.nav button { padding: 12px 10px; font-size: 16px; }
.burger { width: 42px; height: 42px; display: inline-grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.burger svg { width: 22px; height: 22px; }
.mtop-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.mtop-title b { font-family: var(--display); font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtop-title small { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.wa { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; background: var(--wa); color: var(--on-wa); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; border: 0; }
.wa:hover { filter: brightness(1.07); }
.wa svg { width: 16px; height: 16px; }
.wa.off { background: var(--surface2); color: var(--muted); pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .side { transition: transform .22s ease, visibility .22s; } }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.brand small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; text-align: left; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--surface2); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--good); }
.sync.off i { background: var(--warn); }
.netpill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--warn); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); cursor: pointer; }
.netpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.netpill.enviando { border-color: var(--good); }
.netpill.enviando i { background: var(--good); animation: netpulse 1s ease-in-out infinite; }
@keyframes netpulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .netpill.enviando i { animation: none; } }

.main { min-width: 0; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head h2 { margin: 0; font-family: var(--display); font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn svg { width: 16px; height: 16px; }
.backbtn { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 12px 0 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 700; font-size: 14px; flex: none; }
.backbtn svg { width: 20px; height: 20px; }
.backbtn[hidden] { display: none; }
@media (max-width: 420px) { .mtop:has(.backbtn:not([hidden])) .avatar { display: none; } }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 18px; height: 18px; }

/* Pendências */
.pendrow { align-items: center; gap: 12px; }
.pendtags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 4px; }
/* Histórico */
.panel.hist { padding: 6px 16px 14px; }
.hdia { margin: 14px 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.hdia + .hrow { border-top: 0; }
.hrow .htime { flex: none; width: 46px; color: var(--muted); font-size: 13px; padding-top: 2px; }
.hrow.apagou .htime { color: var(--bad); }
.hrow.criou .htime { color: var(--good); }
.hmud { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.hmud span { color: var(--fg); }
.hrow .grow, .pendrow .grow { flex: 1; min-width: 0; }
/* Importar relatório */
.imp-prev { display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow: auto; }
.imp-prev details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.imp-prev summary { cursor: pointer; padding: 4px 0; }
.imp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.imp-kpis div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.imp-kpis b { font-size: 22px; }
.imp-kpis span { font-size: 12px; color: var(--muted); }
.imp-kpis .ok b { color: var(--good); } .imp-kpis .bad b { color: var(--bad); }
.imp-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.imp-list label { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; cursor: pointer; }
.bad-text { color: var(--bad); font-weight: 700; }
.tag.saude { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.ficha { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 4px 12px; margin: 6px 0 0; font-size: 14px; }
.ficha dt { color: var(--muted); } .ficha dd { margin: 0; }
.banner.aviso { border-style: solid; }
.banner.aviso svg { width: 16px; height: 16px; vertical-align: -3px; color: var(--accent); }
.aviso-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
html, body { overscroll-behavior-y: contain; }
.ptr { position: fixed; top: calc(-44px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, 0); z-index: 65; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; }
.ptr.on { opacity: 1; }
.ptr-ico { display: inline-block; font-size: 18px; color: var(--accent); line-height: 1; }
.ptr.girando .ptr-ico { animation: ptrgira .8s linear infinite; }
@keyframes ptrgira { to { transform: rotate(360deg); } }
.bv-top { display: flex; gap: 14px; align-items: center; }
.bv-logo { width: 64px; height: auto; flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
.bv-acesso { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
.bv-dicas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bv-dicas li { display: flex; gap: 10px; align-items: flex-start; }
.bv-dicas svg { width: 20px; height: 20px; flex: none; color: var(--accent); margin-top: 2px; }
.obsbtn { color: var(--muted); }
.obsbtn.tem { color: var(--accent); }
.obsline { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 6px 9px; width: 100%; max-width: 420px; text-align: left; border-radius: 8px;
  border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--fg); font-size: 13px; line-height: 1.35; cursor: pointer; }
.obsline svg { width: 14px; height: 14px; flex: none; color: var(--accent); margin-top: 2px; }
.obsline span { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.obsline { flex-wrap: wrap; }
.obsline span { min-width: 150px; }
.obsline small { flex: 0 0 100%; padding-left: 20px; color: var(--muted); font-size: 11px; }
.table-wrap.people td:first-child { min-width: 260px; }
.table-wrap.people .obsline span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.selbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 10px; background: color-mix(in srgb, var(--bad) 8%, transparent); }
.selbar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.selall { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
.selbox, .selall input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex: none; }
.pcard .top .selbox { margin: 2px 10px 0 0; }
tr.picked td, .pcard.picked { background: var(--accent-soft); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.banner { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
button.kpi:hover { border-color: var(--accent); }
.kpi .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.alert .val { color: var(--accent); }
.bar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel-row { display: grid; grid-template-columns: 150px 1fr 64px; gap: 10px; align-items: center; font-size: 14px; }
.funnel-row b { text-align: right; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* Chips de status */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; background: var(--surface2); color: var(--muted); }
button.chip:hover { border-color: currentColor; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.wait { background: var(--warn-soft); color: var(--warn); }
.chip.sent { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
/* Cronograma: cores como na planilha */
.crono-leg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.crono-leg span { display: inline-flex; align-items: center; gap: 6px; }
.crono-leg span::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.crono-predica { --c: #f39a1e; } .crono-refeicao { --c: #3f8a2e; } .crono-destaque { --c: #6aa6e0; } .crono-especial { --c: #e6d21a; } .crono-pausa { --c: #9a9a9a; }
.table-wrap.crono tr[class*="crono-"]:not(.crono-normal) td:first-child { box-shadow: inset 4px 0 0 var(--c); }
.table-wrap.crono tr:not(.crono-normal) td { background: color-mix(in srgb, var(--c) 14%, transparent); }
.crono-cards .pcard:not(.crono-normal) { border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.table-wrap.crono tr.feito td, .crono-cards .pcard.feito { opacity: .62; }
.table-wrap.crono tr.andando td { background: var(--good-soft); }
.crono-cards .pcard.andando { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.table-wrap.crono tr.proximo td:nth-child(2) b::after, .crono-cards .pcard.proximo b::after { content: "próximo"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.table-wrap.crono td small { display: block; margin-top: 2px; }
.crono-hora { font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface2); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.crono-hora:disabled { cursor: default; }
.crono-h { font-size: 18px; font-weight: 800; min-width: 52px; }
.btn.sm { padding: 5px 12px; font-size: 13px; min-height: 0; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--surface2); color: var(--muted); }
.tag.acc { background: var(--accent); color: var(--on-accent); }

/* Filtros */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
select.sel { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* Tabela de pessoas */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface2); }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tbody tr:hover td { background: var(--accent-soft); }
.pname { font-weight: 600; }
.pname small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.ticks { display: flex; gap: 6px; }
.tick { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); }
.tick svg { width: 15px; height: 15px; }
.tick.on { background: var(--good); border-color: var(--good); color: var(--bg); }
.cards { display: none; flex-direction: column; gap: 10px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pcard .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
