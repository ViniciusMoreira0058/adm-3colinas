<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#090d13">
<title>Ficha de emergência · NFC 3COLINAS</title>
<style>
:root{--bg:#090d13;--card:#121821;--card2:#1a222d;--fg:#fff6ee;--muted:#a59d94;--line:#283240;--accent:#ff7a1a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;padding-bottom:40px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{padding:10px 14px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{margin:0;font-size:24px;line-height:1.15;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.nums{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}
.sangue{padding:4px 12px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:22px}
.nivel{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#111;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 10px;border-radius:999px;background:rgba(239,68,68,.16);color:#f87171;font-weight:700;font-size:13px}
.chip.ok{background:rgba(70,196,134,.16);color:#46c486}
.item{padding:10px 12px;border-radius:10px;background:var(--card2);margin-top:8px}
.item span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.item.alerta{background:rgba(239,68,68,.14)}.item.alerta b{color:#f87171}
h2{margin:0 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card2);margin-top:8px}
.ct small{display:block;color:var(--muted)}
a.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#111!important}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:20px;letter-spacing:.2em;text-align:center;text-transform:uppercase}
label.lb{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.erro{color:#f87171;font-weight:700;min-height:1.4em;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:10px}
</style></head>
<body><main id="m"><div class="top">♥ Ficha de emergência · NFC 3COLINAS</div><div class="card muted">Abrindo…</div></main>
<script src="nfc.js"></script>
<script>
(function () {
  const m = document.getElementById("m"), KEY = "nfc3-codigo";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nada = v => !v || /^(n[aã]o|nenhum[a]?|-)\b/i.test(String(v).trim());
  const COR = ["#7c8794", "#46c486", "#f2c233", "#ff8a1a", "#ef4444", "#a855f7"];
  const lacre = location.hash.slice(1), t = new URLSearchParams(location.search).get("t") || "";
  const ler = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const gravar = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const topo = '<div class="top">♥ Ficha de emergência · NFC 3COLINAS</div>';

  if (!lacre) { m.innerHTML = topo + '<div class="card">Esta tag não tem ficha gravada. Grave de novo pelo app ADM 3Colinas (NFC 3COLINAS → Gravar tag).</div>'; return; }

  function pedir(msg) {
    m.innerHTML = topo + `<div class="card"><b>Digite o código da equipe médica</b>
      <p class="muted" style="margin:6px 0 0">A ficha de saúde está protegida. Só quem tem o código consegue ver. Funciona sem internet.</p>
      <label class="lb" for="c">Código</label><input id="c" autocomplete="off" autocapitalize="characters" inputmode="text">
      <label class="ck"><input type="checkbox" id="lembrar" checked style="width:auto"> Lembrar neste celular</label>
      <div class="erro" id="e">${esc(msg || "")}</div>
      <div class="row"><button class="primary" id="ok" type="button">Abrir ficha</button></div></div>`;
    const c = document.getElementById("c"), ir = () => tentar(c.value, document.getElementById("lembrar").checked);
    document.getElementById("ok").onclick = ir; c.onkeydown = e => { if (e.key === "Enter") ir(); }; c.focus();
  }
  function tentar(cod, lembrar) {
    if (!String(cod).trim()) { pedir("Digite o código."); return; }
    NFC3.abrir(lacre, cod).then(f => { if (lembrar) gravar(KEY, String(cod).trim().toUpperCase()); mostrar(f); })
      .catch(() => { gravar(KEY, ""); pedir("Código errado, ou a tag foi gravada com outro código."); });
  }
  function idade(d) { if (!d) return ""; const n = new Date(d + "T00:00:00"), h = new Date(); let a = h.getFullYear() - n.getFullYear(); if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--; return isNaN(a) ? "" : a + " anos"; }
  function mostrar(f) {
    const kg = Number(String(f.peso).replace(",", ".")), cm = Number(f.altura), imc = kg && cm ? kg / ((cm / 100) ** 2) : 0;
    const com = (f.comorb || []).map(i => NFC3.COMORB[i]).filter(Boolean);
    const nivel = Math.min(5, com.length + (nada(f.alergias) ? 0 : 1) + (nada(f.medicacoes) ? 0 : 1) + (imc >= 30 ? 1 : 0));
    const chips = [...(nada(f.alergias) ? [] : ["Alergia"]), ...com, ...(nada(f.medicacoes) ? [] : ["Usa remédio"])];
    const item = (l, v, alerta) => v ? `<div class="item ${alerta && !nada(v) ? "alerta" : ""}"><span>${l}</span><b>${esc(v)}</b></div>` : "";
    const tel = n => String(n || "").replace(/\D/g, "");
    const ct = (quem, nome, fone) => nome || fone ? `<div class="ct"><div><b>${esc(nome || "—")}</b><small>${esc(quem)}${fone ? " · " + esc(fone) : ""}</small></div>${fone ? `<a class="btn primary" href="tel:+${tel(fone)}">Ligar</a>` : ""}</div>` : "";
    m.innerHTML = topo + `
      <div class="card"><h1>${esc(f.nome)}</h1><div class="sub">${esc(idade(f.nascimento))}${f.top ? " · TOP " + esc(f.top) : ""}</div>
        <div class="nums"><span class="nivel" style="background:${COR[nivel]}" title="Indicativo de saúde">${nivel}</span>${f.sangue ? `<span class="sangue">${esc(f.sangue)}</span>` : ""}
          ${kg ? `<span>${esc(f.peso)} kg</span>` : ""}${cm ? `<span>${esc(f.altura)} cm</span>` : ""}${imc ? `<span>IMC <b>${imc.toFixed(1).replace(".", ",")}</b></span>` : ""}</div>
        <div class="chips">${chips.length ? chips.map(c => `<span class="chip">${esc(c)}</span>`).join("") : '<span class="chip ok">Sem alerta de saúde</span>'}</div></div>
      <div class="card"><h2>Informações médicas</h2>
        ${item("Alergias", f.alergias || "Nenhuma", true)}${item("Medicações em uso", f.medicacoes || "Nenhuma", true)}
        ${com.length ? item("Comorbidades", com.join(", "), true) : ""}${item("Cirurgias", f.cirurgias)}${item("Outras informações", f.outras, true)}${item("Plano de saúde", f.plano)}</div>
      <div class="card"><h2 style="color:#f87171">Contatos de emergência</h2>
        ${ct(f.emergParent || "Pessoa de emergência", f.emergNome, f.emergTel)}${f.conjuge && f.conjuge !== f.emergNome ? ct("Cônjuge", f.conjuge, f.conjugeTel) : ""}</div>
      <div class="card"><p class="muted" style="margin:0 0 8px">Para registrar o atendimento e ver a ficha completa (com foto e histórico), abra no app ADM.</p>
        <div class="row"><a class="btn primary" href="./?nfc=${encodeURIComponent(f.t || t)}${f.demo ? "&demo=1" : ""}">Abrir no app ADM</a><button type="button" id="sair">Esquecer código</button></div>
        ${f.em ? `<p class="muted" style="margin:10px 0 0">Tag gravada em ${esc(new Date(f.em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }))}</p>` : ""}</div>`;
    document.getElementById("sair").onclick = () => { gravar(KEY, ""); pedir(); };
  }
  const salvo = ler(KEY);
  if (salvo) NFC3.abrir(lacre, salvo).then(mostrar).catch(() => pedir()); else pedir();
})();
</script></body></html>
